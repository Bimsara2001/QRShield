# Evaluation-only proxy: it exists only on an internal Docker network and can
# reach exactly one synthetic fixture hostname over TLS. It is not used by
# production scans and creates no route to the public internet.
visible_hostname qrshield-h5-evaluation-proxy
http_port 3128

acl h5_workers src 172.30.240.0/24
acl Safe_ports port 8443
acl SSL_ports port 8443
acl CONNECT method CONNECT
acl h5_fixture dstdomain h5fixtures

http_access deny !h5_workers
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow h5_fixture
http_access deny all

cache deny all
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
pinger_enable off
