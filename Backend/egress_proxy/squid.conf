# QRShield G3C controlled egress proxy configuration.
#
# This configuration is intentionally limited to the disposable G3C isolated
# test subnet. Production network names, runner integration, mixed-DNS policy,
# and runtime hardening are deferred to later G3 stages.

visible_hostname qrshield-egress-proxy
http_port 3128

# Only clients on the final isolated QRShield worker network may use this proxy.
acl qrshield_workers src 172.28.240.0/24

# Deliberately narrow destination-port policy for the first prototype.
acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Explicit local/Docker Desktop aliases. In Squid, the `localhost` entry also
# covers `.localhost` subdomains, so listing both would be rejected as
# redundant by the configuration parser.
acl qrshield_local_names dstdomain localhost localhost. localhost.localdomain ip6-localhost ip6-loopback broadcasthost host.docker.internal gateway.docker.internal

# Literal/resolved non-public destinations. Squid's dst ACL is evaluated
# against destination IP addresses; G3D must still validate mixed-DNS and
# rebinding behaviour before any stronger DNS security claim is made.
acl qrshield_unsafe_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32

# Security denials must precede the only allow rule.
http_access deny !qrshield_workers
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny qrshield_local_names
http_access deny to_localhost
http_access deny to_linklocal
http_access deny qrshield_unsafe_dst
http_access allow qrshield_workers
http_access deny all

# The container drops CAP_NET_RAW, so disable Squid's optional ICMP pinger
# instead of restoring a network capability.
pinger_enable off

# QRShield analyzes pages; it must not retain fetched page content or detailed
# request URLs inside the proxy.
cache deny all
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
